<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body class="{% if page.layout == 'post' %}post-page{% endif %}">

    {% include sidebar.html %}

    <!-- Wrap is the content to shift when toggling the sidebar. We wrap the
         content to avoid any CSS collisions with our real content. -->
    <div class="wrap">
      <div class="masthead">
        <div class="container">
          <h3 class="masthead-title">
            <a href="{{ site.baseurl }}/" title="Home">{{ site.title }}</a>
            <small>{{ site.tagline }}</small>
            
            <div class="masthead-nav">
              <a href="{{ '/about/' | relative_url }}" title="About">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
              </a>
              <a href="{{ '/tags/' | relative_url }}" title="Tags">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
              </a>
              <a href="{{ '/search/' | relative_url }}" title="Search">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </a>
              <a href="javascript:void(0);" id="header-theme-toggle" title="Toggle Dark Mode">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
              </a>
            </div>
          </h3>
        </div>
      </div>

      <div class="container content">
        {{ content }}
      </div>
    </div>

    <label for="sidebar-checkbox" class="sidebar-toggle"></label>

    <script src='{{ site.baseurl }}/public/js/script.js'></script>
    
    <!-- Busuanzi Analytics -->
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <meta name="referrer" content="no-referrer-when-downgrade">

     <!-- 新增：引入 Mermaid JS + 渲染脚本（放在 </body> 前） -->
  <!-- Mermaid 核心库（稳定版 CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <!-- 初始化 Mermaid + 识别代码块 -->
  <script>
    // 配置 Mermaid 渲染样式（适配 Lanyon 极简风格）
    mermaid.initialize({
      theme: 'neutral', // 中性主题，匹配 Lanyon 黑白灰风格
      themeVariables: {
        primaryColor: '#f5f5f5',
        borderColor: '#eee',
        textColor: '#333'
      },
      startOnLoad: false, // 手动触发渲染，避免冲突
      securityLevel: 'loose' // 允许自定义样式
    });

    // 识别所有 ```mermaid 代码块，替换为 Mermaid 容器并渲染
    document.addEventListener('DOMContentLoaded', function() {
      // 找到所有 mermaid 代码块
      const mermaidBlocks = document.querySelectorAll('pre code.language-mermaid');
      mermaidBlocks.forEach(block => {
        // 获取代码内容
        const mermaidCode = block.textContent.trim();
        // 创建 Mermaid 容器
        const mermaidDiv = document.createElement('div');
        mermaidDiv.className = 'mermaid';
        mermaidDiv.textContent = mermaidCode;
        // 替换原代码块
        block.parentElement.replaceWith(mermaidDiv);
      });
      // 渲染所有 Mermaid 容器
      mermaid.run();
    });
      // 目录滚动高亮
  document.addEventListener('DOMContentLoaded', function() {
    (function buildTOC(){
      const tocRoot = document.getElementById('toc');
      const contentEl = document.querySelector('.post-content');
      if (!tocRoot || !contentEl) return;
      const headings = contentEl.querySelectorAll('h2, h3, h4, h5, h6');
      if (!headings.length) return;
      const container = document.createElement('div');
      container.className = 'toc-container';
      const title = document.createElement('h3');
      title.className = 'toc-title';
      title.textContent = '📋 文章目录';
      const list = document.createElement('ul');
      list.className = 'toc-list';
      const slugify = (text) => text
        .trim()
        .toLowerCase()
        .replace(/\s+/g, '-')
        .replace(/[^\w\-\u4e00-\u9fa5]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      headings.forEach(h => {
        const level = Number(h.tagName.slice(1));
        const text = h.textContent.trim();
        if (!text) return;
        if (!h.id) h.id = slugify(text) || ('h' + Math.random().toString(36).slice(2));
        const li = document.createElement('li');
        li.className = `toc-item toc-level-${level}`;
        const a = document.createElement('a');
        a.className = 'toc-link';
        a.href = `#${h.id}`;
        a.textContent = text;
        li.appendChild(a);
        list.appendChild(li);
      });
      container.appendChild(title);
      container.appendChild(list);
      tocRoot.replaceWith(container);
    })();

    const tocLinks = document.querySelectorAll('.toc-link');
    const headings = document.querySelectorAll('.post-content h2, .post-content h3, .post-content h4, .post-content h5, .post-content h6');
    const backToTop = document.querySelector('.back-to-top');
    const postToc = document.querySelector('.post-toc');
    const contentContainer = document.querySelector('.post-page .container.content');
    const postContent = document.querySelector('.post-main') || document.querySelector('.post-content');

    // 监听滚动事件
    window.addEventListener('scroll', function() {
      let currentHeading = '';
      headings.forEach(heading => {
        const rect = heading.getBoundingClientRect();
        if (rect.top <= 100 && rect.bottom >= 0) {
          currentHeading = heading.getAttribute('id');
        }
      });

      // 高亮当前标题的目录链接
      tocLinks.forEach(link => {
        link.classList.remove('active');
        if (link.getAttribute('href') === `#${currentHeading}`) {
          link.classList.add('active');
        }
      });

      if (backToTop) {
        if (window.scrollY > 300) backToTop.classList.add('show');
        else backToTop.classList.remove('show');
      }
    });

    function layoutToc() {
      if (!postToc || !contentContainer || !postContent) return;
      const desktop = window.innerWidth >= 1024;
      if (desktop) {
        const rect = contentContainer.getBoundingClientRect();
        postToc.style.left = `${rect.left + window.scrollX}px`;
        postContent.style.marginLeft = `${postToc.offsetWidth + 32}px`;
      } else {
        postToc.style.left = '';
        postContent.style.marginLeft = '';
      }
    }
    layoutToc();
    window.addEventListener('resize', layoutToc);

    tocLinks.forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href').slice(1);
        const target = document.getElementById(targetId);
        if (target) {
          target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
          });
        }
      });
    });
    if (backToTop) {
      backToTop.addEventListener('click', function() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  });
  </script>
  </body>
</html>
